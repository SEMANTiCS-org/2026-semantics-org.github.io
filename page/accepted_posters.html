  <style>
    .pd-group {
      width: 100%;
      margin-bottom: 25px;
    }

    .pd-group:last-child {
      margin-bottom: 0;
    }

    .pd-group-title {
      margin: 0 0 18px;
      font-size: 26px;
      font-weight: 700;
      line-height: 1.4;
      color: #153B51;
    }

    .pd-table {
      width: 100%;
    }

    /* =========================
     TABLE HEADER
  ========================= */

    .pd-table-header {
      display: grid;
      grid-template-columns: 80px minmax(0, 2fr) minmax(0, 1.5fr) 100px;
      column-gap: 24px;

      padding: 0 22px 10px;

      font-size: 14px;
      font-weight: 700;
      color: #153B51;

      box-sizing: border-box;
    }

    .pd-table-header>div {
      min-width: 0;
      font-weight: 600 !important;
    }

    /* =========================
     TABLE ROW
  ========================= */

    .pd-table-row {
      display: grid;
      grid-template-columns: 80px minmax(0, 2fr) minmax(0, 1.5fr) 100px;
      column-gap: 24px;
      align-items: start;

      width: 100%;
      margin-bottom: 14px;
      padding: 18px 22px;

      background: #153B51;
      border: 2px solid #EB8C34;
      border-radius: 18px;

      box-sizing: border-box;

      text-decoration: none;
      color: #ffffff;

      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        border-color 0.2s ease;
    }

    .pd-table-row:last-child {
      margin-bottom: 0;
    }

    .pd-table-row:hover {
      background: #153B51;
      border-color: #EB8C34;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .pd-table-row>div {
      min-width: 0;
      margin: 0;
      padding: 0;

      text-align: left;
      line-height: 1.5;
    }

    /* =========================
     COLUMNS
  ========================= */

    .pd-col-id {
      font-weight: 600;
    }

    .pd-col-title {
      font-weight: 600;
    }

    .pd-col-authors {
      font-weight: 400;
    }

    .pd-col-media {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }

    .pd-col-media i {
      font-size: 18px;
      line-height: 1;
    }

    /* =========================
     LINKS
  ========================= */

    .pd-table-row a {
      color: inherit;
    }

    .pd-table-row p {
      margin: 0;
    }

    /* =========================
     TABLET / MOBILE
  ========================= */

    @media (max-width: 768px) {

      .pd-group {
        margin-bottom: 35px;
      }

      .pd-group-title {
        font-size: 22px;
        margin-bottom: 15px;
      }

      .pd-table-header {
        grid-template-columns:
          60px minmax(0, 1fr) minmax(0, 1fr) 70px;

        column-gap: 15px;
        padding: 0 16px 9px;

        font-size: 13px;
      }

      .pd-table-row {
        grid-template-columns:
          60px minmax(0, 1fr) minmax(0, 1fr) 70px;

        column-gap: 15px;

        padding: 15px 16px;
        border-radius: 18px;
      }

      .pd-table-row>div {
        font-size: 14px;
      }

      .pd-col-media i {
        font-size: 17px;
      }
    }

    /* =========================
     SMALL MOBILE
  ========================= */

    @media (max-width: 480px) {

      .pd-group-title {
        font-size: 20px;
      }

      .pd-table-header {
        grid-template-columns:
          45px minmax(0, 1fr) minmax(0, 1fr) 55px;

        column-gap: 10px;

        padding-left: 12px;
        padding-right: 12px;
      }

      .pd-table-row {
        grid-template-columns:
          45px minmax(0, 1fr) minmax(0, 1fr) 55px;

        column-gap: 10px;

        padding: 14px 12px;
        border-radius: 18px;
      }

      .pd-table-row>div {
        font-size: 13px;
        line-height: 1.45;
      }

      .pd-col-media i {
        font-size: 16px;
      }
    }

    #pd_list section.pd-group {
      padding: 0 !important;
      margin: 0 0 100px 0 !important;
    }

    #pd_list .pd-group-title {
      margin: 12px 0 12px 0 !important;
      padding: 0 !important;
    }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
  </style>
</head>
