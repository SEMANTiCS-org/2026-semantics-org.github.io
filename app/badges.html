    <main id="main-content">

    <section>
        <div class="container">
            <header>
                <h1>SEMANTiCS Sponsor Badge Scanner</h1>
                <div id="statusBadge" class="status-badge error">Disconnected</div>
            </header>

            <div id="unsupportedAlert" class="alert-box">
                <strong>Browser Unsupported:</strong> The Web Serial API is supported in Google Chrome, Firefox, Microsoft
                Edge, and Opera. Please switch to a compatible desktop browser.
            </div>

            <div class="card">
                <div class="controls">
                    <button id="connectBtn" class="btn">Connect Scanner</button>
                    
                    <button id="exportTtlBtn" class="btn-secondary">Export (.TTL)</button>
                    <button id="exportTxtBtn" class="btn-secondary">Export (.TXT)</button>
                    <button id="exportCsvBtn" class="btn-secondary">Export (.CSV)</button>
                    
                    <button id="clearBtn" class="btn-clear">Clear History</button>
                </div>
            </div>

            <div class="card">
                <div class="stats-bar">
                    <strong>Live Scan Console</strong>
                    <span id="scanCount">Total Scans: 0</span>
                </div>
                <textarea id="logConsole" readonly
                    placeholder="Connect your scanner to begin logging badge data..."></textarea>
            </div>

            <div class="row">
                <div class="col-lg-12 mx-auto">
                    <div class="row">
                        <div class="col-lg-12 mx-auto">
                            <zero-md src="../content/badges.md">
                            <template>

                            </template>

                        </div>
                    </div>
                </div>
            </div>

    </main>

      <script>
        let port = null;
        let reader = null;
        let totalScans = 0;

        const connectBtn = document.getElementById('connectBtn');
        const exportTxtBtn = document.getElementById('exportTxtBtn');
        const exportCsvBtn = document.getElementById('exportCsvBtn');
        const exportTtlBtn = document.getElementById('exportTtlBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusBadge = document.getElementById('statusBadge');
        const logConsole = document.getElementById('logConsole');
        const scanCount = document.getElementById('scanCount');
        const unsupportedAlert = document.getElementById('unsupportedAlert');

        // Check API Compatibility
        if (!('serial' in navigator)) {
            unsupportedAlert.style.display = 'block';
            connectBtn.disabled = true;
        }

        // Load saved scans on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem('badge_scans') || '';
            if (savedData) {
                logConsole.value = savedData;
                logConsole.scrollTop = logConsole.scrollHeight;
                updateCount();
            }
            autoReconnect();
        });

        // Auto-reconnect to previously paired device
        async function autoReconnect() {
            if (!('serial' in navigator)) return;
            const ports = await navigator.serial.getPorts();
            if (ports.length > 0) {
                port = ports[0];
                startSerialConnection(port);
            }
        }

        // Handle connection button click
        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                startSerialConnection(port);
            } catch (err) {
                console.warn('User cancelled port selection or connection failed:', err);
            }
        });

        // Establish serial connection loop
        async function startSerialConnection(selectedPort) {
            try {
                await selectedPort.open({ baudRate: 9600 });
                updateStatus(true);

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = selectedPort.readable.pipeTo(textDecoder.writable);
                reader = textDecoder.readable.getReader();

                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {
                        reader.releaseLock();
                        break;
                    }
                    if (value) {
                        buffer += value;
                        if (buffer.includes('\n') || buffer.includes('\r')) {
                            const lines = buffer.split(/\r?\n/);
                            buffer = lines.pop(); // Retain unfinished chunk
                            lines.forEach(line => {
                                const clean = line.trim();
                                if (clean) processScan(clean);
                            });
                        }
                    }
                }
            } catch (err) {
                console.error('Serial connection error:', err);
                updateStatus(false);
            }
        }

        // Process and record incoming scan
        function processScan(data) {
            const now = new Date();
            const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);
            const logEntry = `[${timestamp}] ${data}\n`;

            // Update UI Console
            logConsole.value += logEntry;
            logConsole.scrollTop = logConsole.scrollHeight;

            // Persist to local storage immediately
            const existingData = localStorage.getItem('badge_scans') || '';
            localStorage.setItem('badge_scans', existingData + logEntry);

            updateCount();
        }

        function updateCount() {
            const lines = logConsole.value.trim().split('\n').filter(l => l.length > 0);
            totalScans = lines.length;
            scanCount.innerText = `Total Scans: ${totalScans}`;
        }

        function updateStatus(isConnected) {
            if (isConnected) {
                statusBadge.innerText = 'Connected';
                statusBadge.className = 'status-badge connected';
                connectBtn.innerText = 'Scanner Active';
                connectBtn.disabled = true;
            } else {
                statusBadge.innerText = 'Disconnected';
                statusBadge.className = 'status-badge error';
                connectBtn.innerText = 'Connect Scanner';
                connectBtn.disabled = false;
            }
        }

            // Helper to escape CSV values
        function escapeCsv(val) {
            if (val === null || val === undefined) return '';
            return String(val).replace(/"/g, '""');
        }

        // Helper to escape Turtle (TTL) string literals
        function escapeTurtle(val) {
            if (val === null || val === undefined) return '';
            return String(val).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\r?\n/g, '\\n');
        }

        // Parse MECARD standard format (e.g. MECARD:N:Pieter Colpaert;ORG:Ghent University;EMAIL:pieter.colpaert@ugent.be;;)
        function parseMecard(str) {
            const body = str.replace(/^MECARD:/i, '');
            const fields = {};
            let currentKey = null;
            let currentValue = '';
            let isEscaped = false;
            let readingKey = true;
            let keyBuffer = '';

            for (let i = 0; i < body.length; i++) {
                const char = body[i];
                if (isEscaped) {
                    if (readingKey) keyBuffer += char;
                    else currentValue += char;
                    isEscaped = false;
                    continue;
                }
                if (char === '\\') {
                    isEscaped = true;
                    continue;
                }
                if (readingKey) {
                    if (char === ':') {
                        currentKey = keyBuffer.trim().toUpperCase();
                        keyBuffer = '';
                        currentValue = '';
                        readingKey = false;
                    } else if (char === ';') {
                        keyBuffer = '';
                    } else {
                        keyBuffer += char;
                    }
                } else {
                    if (char === ';') {
                        if (currentKey) {
                            if (!fields[currentKey]) {
                                fields[currentKey] = currentValue.trim();
                            } else {
                                fields[currentKey] += ', ' + currentValue.trim();
                            }
                        }
                        readingKey = true;
                        currentKey = null;
                        currentValue = '';
                    } else {
                        currentValue += char;
                    }
                }
            }
            return fields;
        }

        // Generic badge data parser supporting MECARD, vCard, Delimited (CSV/Semicolon/Pipe/Tab), and JSON
        function parseBadgeData(badge) {
            if (!badge) return null;
            const raw = badge.trim();

            // 1. MECARD Format
            if (/^MECARD:/i.test(raw)) {
                const fields = parseMecard(raw);
                let name = fields['N'] || fields['FN'] || fields['NAME'] || '';
                if (name.includes(',')) {
                    const parts = name.split(',').map(s => s.trim()).filter(Boolean);
                    if (parts.length >= 2) {
                        name = `${parts.slice(1).join(' ')} ${parts[0]}`;
                    }
                }
                const affiliation = fields['ORG'] || fields['AFFILIATION'] || fields['COMPANY'] || '';
                const email = fields['EMAIL'] || fields['MAIL'] || fields['EM'] || '';

                return {
                    name: name || null,
                    affiliation: affiliation || null,
                    email: email || null,
                    format: 'MECARD'
                };
            }

            // 2. vCard Format
            if (/BEGIN:VCARD/i.test(raw)) {
                const fnMatch = raw.match(/(?:^|\r?\n)FN:(.*?)(?:\r?\n|$)/i);
                const nMatch = raw.match(/(?:^|\r?\n)N:(.*?)(?:\r?\n|$)/i);
                let name = fnMatch ? fnMatch[1].trim() : '';
                if (!name && nMatch) {
                    const parts = nMatch[1].split(';').map(s => s.trim()).filter(Boolean);
                    name = parts.reverse().join(' ');
                }
                const orgMatch = raw.match(/(?:^|\r?\n)ORG:(.*?)(?:\r?\n|$)/i);
                const emailMatch = raw.match(/(?:^|\r?\n)EMAIL[^:]*:(.*?)(?:\r?\n|$)/i);

                return {
                    name: name || null,
                    affiliation: orgMatch ? orgMatch[1].replace(/;/g, ' ').trim() : null,
                    email: emailMatch ? emailMatch[1].trim() : null,
                    format: 'vCard'
                };
            }

            // 3. JSON Format
            if (raw.startsWith('{') && raw.endsWith('}')) {
                try {
                    const obj = JSON.parse(raw);
                    const name = obj.name || obj.fullName || obj.fn || obj.n || '';
                    const affiliation = obj.affiliation || obj.organization || obj.org || obj.company || '';
                    const email = obj.email || obj.mail || '';
                    if (name || affiliation || email) {
                        return {
                            name: name || null,
                            affiliation: affiliation || null,
                            email: email || null,
                            format: 'JSON'
                        };
                    }
                } catch (e) {
                    // Ignore JSON parsing errors
                }
            }

            // 4. Delimited formats (Semicolon, Tab, Pipe)
            let delimiter = null;
            if (raw.includes(';')) delimiter = ';';
            else if (raw.includes('\t')) delimiter = '\t';
            else if (raw.includes('|')) delimiter = '|';

            if (delimiter) {
                const parts = raw.split(delimiter).map(p => p.trim()).filter(p => p.length > 0);
                if (parts.length >= 2) {
                    let name = null, affiliation = null, email = null;
                    let isKeyVal = false;

                    for (const part of parts) {
                        if (/^(?:N|NAME|FN):/i.test(part)) {
                            name = part.replace(/^(?:N|NAME|FN):/i, '').trim();
                            isKeyVal = true;
                        } else if (/^(?:ORG|AFFILIATION|COMPANY):/i.test(part)) {
                            affiliation = part.replace(/^(?:ORG|AFFILIATION|COMPANY):/i, '').trim();
                            isKeyVal = true;
                        } else if (/^(?:EMAIL|MAIL|EM):/i.test(part)) {
                            email = part.replace(/^(?:EMAIL|MAIL|EM):/i, '').trim();
                            isKeyVal = true;
                        }
                    }

                    if (isKeyVal) {
                        return { name, affiliation, email, format: 'Delimited-Tagged' };
                    }

                    if (parts.length === 3) {
                        let pName = parts[0];
                        let pAffil = parts[1];
                        let pEmail = parts[2];
                        if (pAffil.includes('@') && !pEmail.includes('@')) {
                            pEmail = parts[1];
                            pAffil = parts[2];
                        }
                        return { name: pName, affiliation: pAffil, email: pEmail, format: 'Positional' };
                    } else if (parts.length === 2) {
                        let pName = parts[0];
                        let pOther = parts[1];
                        let pEmail = pOther.includes('@') ? pOther : null;
                        let pAffil = !pOther.includes('@') ? pOther : null;
                        return { name: pName, affiliation: pAffil, email: pEmail, format: 'Positional' };
                    }
                }
            }

            return null;
        }

        // Export functionality
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        exportTxtBtn.addEventListener('click', () => {
            const data = localStorage.getItem('badge_scans');
            if (!data) return alert('No scans to export.');
            const dateStr = new Date().toISOString().slice(0, 10);
            downloadFile(data, `badge_scans_${dateStr}.txt`, 'text/plain;charset=utf-8');
        });

        exportCsvBtn.addEventListener('click', () => {
            const data = localStorage.getItem('badge_scans');
            if (!data) return alert('No scans to export.');

            const lines = data.trim().split('\n');
            let csvContent = 'Timestamp,Name,Affiliation,Email,Raw Data\n';

            lines.forEach(line => {
                const match = line.match(/^\[(.*?)\] (.*)$/);
                if (match) {
                    const time = match[1];
                    const rawContent = match[2];
                    const parsed = parseBadgeData(rawContent);

                    const name = parsed ? (parsed.name || '') : '';
                    const affiliation = parsed ? (parsed.affiliation || '') : '';
                    const email = parsed ? (parsed.email || '') : '';

                    csvContent += `"${escapeCsv(time)}","${escapeCsv(name)}","${escapeCsv(affiliation)}","${escapeCsv(email)}","${escapeCsv(rawContent)}"\n`;
                }
            });

            const dateStr = new Date().toISOString().slice(0, 10);
            downloadFile(csvContent, `badge_scans_${dateStr}.csv`, 'text/csv;charset=utf-8');
        });

        exportTtlBtn.addEventListener('click', () => {
            const data = localStorage.getItem('badge_scans');
            if (!data) return alert('No scans to export.');

            const lines = data.trim().split('\n');
            let ttlContent = `@prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .\n` +
                             `@prefix xsd: <http://www.w3.org/2001/XMLSchema#> .\n` +
                             `@prefix sosa: <http://www.w3.org/ns/sosa/> .\n` +
                             `@prefix schema: <http://schema.org/> .\n` +
                             `@prefix : <http://semantics.cc/ns/badge#> .\n\n`;

            lines.forEach((line, index) => {
                const match = line.match(/^\[(.*?)\] (.*)$/);
                if (match) {
                    const timeRaw = match[1]; // e.g. "2026-08-06 15:37:38"
                    const time = timeRaw.replace(' ', 'T') + 'Z';
                    const timeClean = timeRaw.replace(/[^0-9]/g, ''); // e.g. "20260806153738"
                    const badge = match[2];
                    
                    const id = `scan_${timeClean}_${index + 1}`;
                    const parsed = parseBadgeData(badge);

                    if (parsed && (parsed.name || parsed.affiliation || parsed.email)) {
                        const personId = `person_${timeClean}_${index + 1}`;

                        ttlContent += `:${id} a sosa:Observation ;\n` +
                                     `    sosa:resultTime "${time}"^^xsd:dateTime ;\n` +
                                     `    sosa:hasSimpleResult "${escapeTurtle(badge)}" ;\n` +
                                     `    sosa:hasFeatureOfInterest :${personId} .\n\n`;

                        let personTtl = `:${personId} a schema:Person`;
                        if (parsed.name) {
                            personTtl += ` ;\n    schema:name "${escapeTurtle(parsed.name)}"`;
                        }
                        if (parsed.email) {
                            personTtl += ` ;\n    schema:email "${escapeTurtle(parsed.email)}"`;
                        }
                        if (parsed.affiliation) {
                            personTtl += ` ;\n    schema:affiliation [\n` +
                                         `        a schema:Organization ;\n` +
                                         `        schema:name "${escapeTurtle(parsed.affiliation)}"\n` +
                                         `    ]`;
                        }
                        personTtl += ` .\n\n`;
                        ttlContent += personTtl;
                    } else {
                        ttlContent += `:${id} a sosa:Observation ;\n` +
                                     `    sosa:resultTime "${time}"^^xsd:dateTime ;\n` +
                                     `    sosa:hasSimpleResult "${escapeTurtle(badge)}" .\n\n`;
                    }
                }
            });

            const dateStr = new Date().toISOString().slice(0, 10);
            downloadFile(ttlContent, `badge_scans_${dateStr}.ttl`, 'text/turtle;charset=utf-8');
        });

        // Clear Storage
        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all log history?')) {
                localStorage.removeItem('badge_scans');
                logConsole.value = '';
                updateCount();
            }
        });

        // Warn user before closing tab while scanning
        window.addEventListener('beforeunload', (e) => {
            if (port && port.readable) {
                e.preventDefault();
                e.returnValue = '';
            }
        });
    </script>
